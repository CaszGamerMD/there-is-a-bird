name: Fabric 26.2 port (work in progress)
on:
  push:
    branches: ["port/fabric-26.2"]
  pull_request:
    branches: ["port/fabric-26.2"]
concurrency:
  group: fabric-26-2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit legacy API references
        run: python3 tools/port-audit.py
      - name: Verify resource and registry ID parity
        run: python3 tools/check-registry-parity.py
      - name: Verify item model bridges and jukebox song data
        run: python3 tools/check-port-resources.py
      - name: Verify Fabric server lifecycle parity and bootstrap order
        run: python3 tools/check-lifecycle-port.py
      - name: Verify GeckoLib 5 block-entity gameplay source parity
        run: python3 tools/check-geckolib-blockentities.py
      - name: Verify private frame workbench persistence and unchanged crafting gameplay
        run: python3 tools/check-frame-workbench-port.py
      - name: Verify bird entity spawn and pathfinding class migrations
        run: python3 tools/check-bird-entity-enums.py
      - name: Verify bird synced-data initial values and inheritance order
        run: python3 tools/check-bird-synced-data-port.py
      - name: Verify authored projectile and photograph entity gameplay after 26.2 API updates
        run: python3 tools/check-bird-projectile-entity-api.py
      - name: Verify original bird movement sync signals on Minecraft 26.2
        run: python3 tools/check-bird-movement-sync-port.py
      - name: Verify bird build-height limits preserved on modern world accessors
        run: python3 tools/check-bird-world-height-port.py
      - name: Verify bird client server guards use 26.2 method access
        run: python3 tools/check-bird-client-guards-port.py
      - name: Verify remaining bird Nullable and relocated entity imports
        run: python3 tools/check-bird-relocated-api.py
      - name: Verify original bird nullable annotations through 26.2 relocation
        run: python3 tools/check-bird-nullable-port.py
      - name: Verify nine original bird flight marker migrations
        run: python3 tools/check-bird-flight-marker-port.py
      - name: Verify per-bird GeckoLib 5 mutation and render-scale state
        run: python3 tools/check-geckolib-bird-renderstate.py
      - name: Verify bird AI preserved through GeckoLib 5 API substitutions
        run: python3 tools/check-geckolib-birds.py
      - name: Verify all 19 original bird attribute profiles
        run: python3 tools/check-bird-attributes.py
      - name: Verify original three feather-fan enchanted book visuals and tooltip keys
        run: python3 tools/check-feather-book-tooltips.py
      - name: Verify polluted cake SavedData format and original runtime behavior
        run: python3 tools/check-polluted-cake-saveddata-port.py
      - name: Verify prank food and dropping effects against original authored gameplay
        run: python3 tools/check-dropping-effects-port.py
      - name: Verify bird-dropping pressure-plate pulse timing and Fabric callbacks
        run: python3 tools/check-bird-pressure-pulse-port.py
      - name: Verify bird population, cassowary AI and advancement parity
        run: python3 tools/check-bird-entity-events.py
      - name: Verify original vanilla Creative tab contents
        run: python3 tools/check-bird-creative.py
      - name: Verify vanilla natural spawning also applies dynamic bird modifiers
        run: python3 tools/check-bird-potential-spawns-mixin.py
      - name: Verify 26.2 bird weighted spawn pools and repopulation source parity
        run: python3 tools/check-bird-weighted-spawns-port.py
      - name: Verify bird repopulation cadence and loaded-world cleanup in Fabric
        run: python3 tools/check-bird-repopulation-lifecycle.py
      - name: Verify 26.2 flyby initializers and kingfisher spawn-egg bypass
        run: python3 tools/check-bird-spawn-reason-port.py
      - name: Verify flyby spawns, colony scores and polluted cake parity
        run: python3 tools/check-bird-spawn-events.py
      - name: Verify all 19 bird spawn placements and leaves predicates
        run: python3 tools/check-bird-spawn-placements.py
      - name: Verify original mod setup, bird compost and farmland chances
        run: python3 tools/check-bird-setup-parity.py
      - name: Verify 98 original advancements, loot tables and tags survive 26.2 paths
        run: python3 tools/check-26-2-datapack-paths.py
      - name: Verify cancellable night heron fish-capture callback
        run: python3 tools/check-night-heron-capture-port.py
      - name: Verify native tick-driven bird droppings without retired Forge subscriber
        run: python3 tools/check-bird-dropping-subscription.py
      - name: Verify prank-food data components, eating callback and tooltips
        run: python3 tools/check-prank-food-port.py
      - name: Verify original feather and droppings lifetimes via native 26.2 item ages
        run: python3 tools/check-bird-ambient-drop-port.py
      - name: Verify original bird shearing, regrowth and persistent flight restriction
        run: python3 tools/check-bird-shearing-port.py
      - name: Verify all 15 original network packets and server commands migrated
        run: python3 tools/check-final-network-port.py
      - name: Verify seven Fabric photo-transfer payloads preserve original bounded wire codecs
        run: python3 tools/check-photo-transfer-network-port.py
      - name: Verify Fabric runtime-config synchronization and original boolean order
        run: python3 tools/check-runtime-config-network-port.py
      - name: Verify charged feather fan Fabric input and C2S packet chain
        run: python3 tools/check-feather-fan-network-port.py
      - name: Verify feather fan combat protection and kill particle parity
        run: python3 tools/check-feather-fan-combat-port.py
      - name: Verify original bird feathers, no-death-loot rule and golden rewards
        run: python3 tools/check-bird-death-drops-port.py
      - name: Verify all three additive Fabric loot modifiers retain source rates
        run: python3 tools/check-bird-all-loot-modifiers-port.py
      - name: Verify Fabric chest-note loot insertion and source rarity parity
        run: python3 tools/check-bird-note-loot-port.py
      - name: Verify authored bird note content and 26.2 advancement callbacks
        run: python3 tools/check-bird-note-components-port.py
      - name: Verify packaged 26.2 advancement display icons
        run: |
          chmod +x gradlew
          ./gradlew processResources --no-daemon
          python3 tools/check-26-2-advancement-codecs.py
      - name: Verify camera tooltip parity and Fabric client bootstrap
        run: python3 tools/check-camera-tooltip-port.py
      - name: Verify all 21 original recipes survive the 26.2 datapack schema
        run: python3 tools/check-26-2-recipes.py
      - name: Verify five GeckoLib 5 static model asset paths and API adaptation
        run: python3 tools/check-geckolib-static-models.py
      - name: Verify 17 original species definition constants and geometry/texture IDs
        run: python3 tools/check-bird-definition-identifiers.py
      - name: Verify original night heron AI and bird bath lookup through 26.2 type relocations
        run: python3 tools/check-safe-api-relocations.py
      - name: Verify original diet tags, sky-bird ecology, and handbook IDs
        run: python3 tools/check-identifier-only-ports.py
      - name: Verify sky-bird sprites, flock sizes and animation timing parity
        run: python3 tools/check-skybird-port.py
      - name: Verify migrated sound and particle APIs compile on 26.2
        run: |
          chmod +x gradlew
          ./gradlew verifyRegistriesPort --no-daemon --stacktrace
      - name: Verify distance-driven walking regression behavior
        run: java -cp build/port-proof/sounds EdDYON.guaniao.content.bird.BirdWalkDistanceRegression
      - name: Gradle compilation (must pass before release)
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon --stacktrace
      - name: Verify port and package
        run: ./gradlew build --no-daemon
      # Only collect an actual fully compiled/mod-remapped test JAR. No public
      # release is created and a partial or uncompiled migration is never
      # advertised as playable.
      - name: Upload successful private Fabric test JAR
        uses: actions/upload-artifact@v4
        with:
          name: guaniao-fabric-26.2-private-test
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 7
