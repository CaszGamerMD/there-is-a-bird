plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = "${mod_version}+fabric26.2.dev"
group = mod_group_id
base { archivesName = "guaniao-fabric-26.2-UNFINISHED" }

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    // GeckoLib 5 resolves model IDs below geckolib/models and animation IDs
    // below geckolib/animations. Stage byte-identical private copies at build
    // time, leaving the original authored JSON assets untouched in the repo.
    doLast {
        def assets = new File(destinationDir, 'assets/guaniao')
        def originalModels = new File(assets, 'geo')
        if (originalModels.isDirectory()) {
            project.copy {
                from originalModels
                include '**/*.geo.json'
                into new File(assets, 'geckolib/models')
            }
        }
        def originalAnimations = new File(assets, 'animations')
        if (originalAnimations.isDirectory()) {
            project.copy {
                from originalAnimations
                include '**/*.animation.json'
                into new File(assets, 'geckolib/animations')
            }
        }
    }
    // 26.2 now decodes advancement display icons as ItemStackTemplate (id, not item).
    // Restrict this to the icon object so no item predicates or other authored data change.
    doLast {
        fileTree(destinationDir).matching {
            include 'data/guaniao/advancement/husbandry/*.json'
        }.each { file ->
            def existing = file.getText('UTF-8')
            def migrated = existing.replaceFirst(/("icon"\s*:\s*\{\s*)"item"(\s*:)/, '$1"id"$2')
            if (migrated != existing) file.setText(migrated, 'UTF-8')
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '3000'])
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.register('migrationAudit', Exec) {
    group = 'verification'
    description = 'Report unported Forge, networking, GeckoLib and other 26.2 API code.'
    commandLine 'python3', 'tools/port-audit.py', '--strict'
}
tasks.named('check') { dependsOn 'migrationAudit' }
tasks.named('jar') {
    // The port is not a release. Retain copyright data during local development.
    from('LICENSE') { rename { 'LICENSE_guaniao' } }
    from('LICENSE-MODELS.md')
    from('DISTRIBUTION-POLICY.md')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

/**
 * Compile migrated standalone Fabric infrastructure independently while unrelated legacy
 * Forge sources remain unported. This is a genuine 26.2 API compilation gate.
 */
