plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = "${mod_version}+fabric26.2.dev"
group = mod_group_id
base { archivesName = "guaniao-fabric-26.2-UNFINISHED" }

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '3000'])
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.register('migrationAudit', Exec) {
    group = 'verification'
    description = 'Report unported Forge, networking, GeckoLib and other 26.2 API code.'
    commandLine 'python3', 'tools/port-audit.py', '--strict'
}
tasks.named('check') { dependsOn 'migrationAudit' }
tasks.named('jar') {
    // The port is not a release. Retain copyright data during local development.
    from('LICENSE') { rename { 'LICENSE_guaniao' } }
    from('LICENSE-MODELS.md')
    from('DISTRIBUTION-POLICY.md')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

/**
 * Compile the migrated sound registry independently while unrelated legacy
 * Forge sources remain unported. This is a genuine 26.2 API compilation gate.
 */
tasks.register('verifySoundPort', JavaCompile) {
    group = 'verification'
    description = 'Compile the Fabric sound registry against actual Minecraft 26.2.'
    source = fileTree('src/main/java') {
        include 'EdDYON/guaniao/registry/GuaniaoSoundEvents.java'
    }
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('port-proof/sounds')
    options.release = 25
    options.encoding = 'UTF-8'
}
