plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = "${mod_version}+fabric26.2.dev"
group = mod_group_id
base { archivesName = "guaniao-fabric-26.2-UNFINISHED" }

repositories {
    mavenCentral()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'com.geckolib' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    // 26.2 now decodes advancement display icons as ItemStackTemplate (id, not item).
    // Restrict this to the icon object so no item predicates or other authored data change.
    doLast {
        fileTree(destinationDir).matching {
            include 'data/guaniao/advancement/husbandry/*.json'
        }.each { file ->
            def existing = file.getText('UTF-8')
            def migrated = existing.replaceFirst(/("icon"\s*:\s*\{\s*)"item"(\s*:)/, '$1"id"$2')
            if (migrated != existing) file.setText(migrated, 'UTF-8')
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '3000'])
}
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.register('migrationAudit', Exec) {
    group = 'verification'
    description = 'Report unported Forge, networking, GeckoLib and other 26.2 API code.'
    commandLine 'python3', 'tools/port-audit.py', '--strict'
}
tasks.named('check') { dependsOn 'migrationAudit' }
tasks.named('jar') {
    // The port is not a release. Retain copyright data during local development.
    from('LICENSE') { rename { 'LICENSE_guaniao' } }
    from('LICENSE-MODELS.md')
    from('DISTRIBUTION-POLICY.md')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

/**
 * Compile migrated standalone Fabric infrastructure independently while unrelated legacy
 * Forge sources remain unported. This is a genuine 26.2 API compilation gate.
 */
tasks.register('verifyRegistriesPort', JavaCompile) {
    group = 'verification'
    description = 'Compile migrated Fabric registries, perch tag and registration queue against Minecraft 26.2.'
    source = fileTree('src/main/java') {
        include 'EdDYON/guaniao/registry/GuaniaoSoundEvents.java'
        include 'EdDYON/guaniao/registry/GuaniaoParticleTypes.java'
        // The real initializer depends on unported gameplay classes and is checked by full compileJava.
        include 'EdDYON/guaniao/GuaniaoMod.java'
        include 'EdDYON/guaniao/fabric/FabricRegistryQueue.java'
        include 'EdDYON/guaniao/fabric/GuaniaoRegistryIds.java'
        include 'EdDYON/guaniao/registry/GuaniaoBlockTags.java'
        include 'EdDYON/guaniao/content/bird/BirdTags.java'
        include 'EdDYON/guaniao/client/skybird/SkyBirdEcology.java'
        include 'EdDYON/guaniao/client/guide/HandbookData.java'
        include 'EdDYON/guaniao/client/skybird/SkyBirdSpecies.java'
        include 'EdDYON/guaniao/config/BirdSpecies.java'
        include 'EdDYON/guaniao/content/bath/BirdBathVariant.java'
        include 'EdDYON/guaniao/content/cage/BirdCageVariant.java'
        include 'EdDYON/guaniao/content/bird/columbid/ColumbidVariant.java'
        include 'EdDYON/guaniao/content/bird/FullColorSpawnEggItem.java'
        include 'EdDYON/guaniao/content/bird/flight/BirdFlightAnimation.java'
        include 'EdDYON/guaniao/content/bird/flight/BirdFlightLock.java'
        include 'EdDYON/guaniao/mixin/ItemEntityAgeAccessor.java'
        include 'EdDYON/guaniao/content/bird/BirdWalkStride.java'
        include 'EdDYON/guaniao/content/bird/BirdWalkDistance.java'
    }
    source files('tools/port-probes/GuaniaoRegistrationProof.java', 'tools/port-probes/GuaniaoLifecycleProof.java', 'tools/port-probes/GuaniaoGeckoProof.java', 'tools/port-probes/GuaniaoRecipeCodecProof.java', 'tools/port-probes/GuaniaoClientTooltipProof.java', 'tools/port-probes/GuaniaoJukeboxProof.java', 'tools/port-probes/GuaniaoDeathLootProof.java', 'tools/port-probes/GuaniaoSpawnRulesProof.java', 'tools/port-probes/GuaniaoShearAttachmentProof.java', 'tools/port-probes/GuaniaoGeckoAnimationProof.java', 'tools/port-probes/GuaniaoGeckoTimelineProof.java', 'tools/port-probes/BirdWalkDistanceRegression.java', 'tools/port-probes/GuaniaoHostileAiProof.java', 'tools/port-probes/GuaniaoPersistenceProof.java', 'tools/port-probes/GuaniaoSpawnPlacementProof.java', 'tools/port-probes/GuaniaoPressurePlateProof.java', 'tools/port-probes/GuaniaoDroppingEffectsProof.java', 'tools/port-probes/GuaniaoSavedDataProof.java', 'tools/port-probes/GuaniaoEnchantedBookTooltipProof.java', 'tools/port-probes/GuaniaoBirdEnumProof.java', 'tools/port-probes/GuaniaoBirdIdentifierProof.java', 'tools/port-probes/GuaniaoBirdFlightMarkerProof.java', 'tools/port-probes/GuaniaoBirdSyncedDataProof.java', 'tools/port-probes/GuaniaoWorldHeightProof.java', 'tools/port-probes/GuaniaoBirdMovementSyncProof.java', 'tools/port-probes/GuaniaoRelocatedTypesProof.java', 'tools/port-probes/GuaniaoCaptureEventProof.java', 'tools/port-probes/GuaniaoFeatherFanCombatProof.java', 'tools/port-probes/GuaniaoFlybySpawnProof.java', 'tools/port-probes/GuaniaoWeightedSpawnProof.java', 'tools/port-probes/GuaniaoNaturalSpawnHookProof.java', 'tools/port-probes/GuaniaoPrankFoodProof.java', 'tools/port-probes/GuaniaoNoteComponentsProof.java', 'tools/port-probes/GuaniaoFeatherFanPacketProof.java', 'tools/port-probes/GuaniaoRuntimeConfigPacketProof.java', 'tools/port-probes/GuaniaoBirdNoteLootProof.java', 'tools/port-probes/GuaniaoPhotoTransferPacketProof.java', 'tools/port-probes/GuaniaoFinalNetworkingProof.java')
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('port-proof/sounds')
    options.release = 25
    options.encoding = 'UTF-8'
}
