name: Build (legacy Forge)
on:
  push:
    branches:
      - main
      - "mc/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "mc/**"
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check public source files
        run: python3 .github/check-public-source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build legacy Forge
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
