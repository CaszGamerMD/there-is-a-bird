name: Fabric 26.2 port (work in progress)
on:
  push:
    branches: ["port/fabric-26.2"]
  pull_request:
    branches: ["port/fabric-26.2"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit legacy API references
        run: python3 tools/port-audit.py
      - name: Gradle compilation (must pass before release)
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon --stacktrace
      - name: Verify port and package
        run: ./gradlew build --no-daemon
