name: Fabric 26.2 port (work in progress)
on:
  push:
    branches: ["port/fabric-26.2"]
  pull_request:
    branches: ["port/fabric-26.2"]
concurrency:
  group: fabric-26-2-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Audit legacy API references
        run: python3 tools/port-audit.py
      - name: Verify resource and registry ID parity
        run: python3 tools/check-registry-parity.py
      - name: Verify item model bridges and jukebox song data
        run: python3 tools/check-port-resources.py
      - name: Verify Fabric server lifecycle parity and bootstrap order
        run: python3 tools/check-lifecycle-port.py
      - name: Verify GeckoLib 5 block-entity gameplay source parity
        run: python3 tools/check-geckolib-blockentities.py
      - name: Verify private frame workbench persistence and unchanged crafting gameplay
        run: python3 tools/check-frame-workbench-port.py
      - name: Verify bird AI preserved through GeckoLib 5 API substitutions
        run: python3 tools/check-geckolib-birds.py
      - name: Verify all 19 original bird attribute profiles
        run: python3 tools/check-bird-attributes.py
      - name: Verify bird population, cassowary AI and advancement parity
        run: python3 tools/check-bird-entity-events.py
      - name: Verify original vanilla Creative tab contents
        run: python3 tools/check-bird-creative.py
      - name: Verify flyby spawns, colony scores and polluted cake parity
        run: python3 tools/check-bird-spawn-events.py
      - name: Verify all 19 bird spawn placements and leaves predicates
        run: python3 tools/check-bird-spawn-placements.py
      - name: Verify original mod setup, bird compost and farmland chances
        run: python3 tools/check-bird-setup-parity.py
      - name: Verify 17 original species definition constants and geometry/texture IDs
        run: python3 tools/check-bird-definition-identifiers.py
      - name: Verify original night heron AI and bird bath lookup through 26.2 type relocations
        run: python3 tools/check-safe-api-relocations.py
      - name: Verify original diet tags, sky-bird ecology, and handbook IDs
        run: python3 tools/check-identifier-only-ports.py
      - name: Verify sky-bird sprites, flock sizes and animation timing parity
        run: python3 tools/check-skybird-port.py
      - name: Verify migrated sound and particle APIs compile on 26.2
        run: |
          chmod +x gradlew
          ./gradlew verifyRegistriesPort --no-daemon --stacktrace
      - name: Verify distance-driven walking regression behavior
        run: java -cp build/port-proof/sounds EdDYON.guaniao.content.bird.BirdWalkDistanceRegression
      - name: Gradle compilation (must pass before release)
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon --stacktrace
      - name: Verify port and package
        run: ./gradlew build --no-daemon
